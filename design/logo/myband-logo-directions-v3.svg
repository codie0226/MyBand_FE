<svg width="1600" height="1240" viewBox="0 0 1600 1240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CFE7FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <style>
      .canvas { fill: #FFFFFF; }
      .tile { fill: #FFFFFF; stroke: #DCDEE0; stroke-width: 1; }
      .soft { fill: #FAFAFA; }
      .ink { fill: #171717; }
      .muted { fill: #60646C; }
      .hair { stroke: #DCDEE0; stroke-width: 2; }
      .line { stroke: #171717; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .line-sm { stroke: #171717; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .line-white { stroke: #FFFFFF; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .title { font: 600 28px Inter, Arial, sans-serif; fill: #171717; letter-spacing: -0.7px; }
      .kicker { font: 600 12px Inter, Arial, sans-serif; fill: #171717; letter-spacing: 1.1px; }
      .desc { font: 400 15px Inter, Arial, sans-serif; fill: #60646C; }
      .word { font: 700 36px Inter, Arial, sans-serif; fill: #171717; letter-spacing: -1.8px; }
      .word-white { font: 700 36px Inter, Arial, sans-serif; fill: #FFFFFF; letter-spacing: -1.8px; }
      .caption { font: 500 13px Inter, Arial, sans-serif; fill: #60646C; }
      .small { font: 600 11px Inter, Arial, sans-serif; fill: #60646C; letter-spacing: 0.8px; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1240"/>
  <circle cx="170" cy="0" r="245" fill="url(#sky)" opacity=".72"/>
  <text x="64" y="78" class="title">MyBand · logo directions</text>
  <text x="64" y="110" class="desc">A compact black-and-white identity system designed for the current product UI: quiet, collaborative, and musical without looking like a music player.</text>

  <!-- 01: MB PULSE -->
  <g transform="translate(64 168)">
    <rect class="tile" width="704" height="430" rx="16"/>
    <text x="32" y="42" class="kicker">01 · MB PULSE</text>
    <text x="32" y="72" class="desc">Recommended — product-first monogram with a restrained musical beat.</text>

    <g transform="translate(32 108)">
      <rect width="146" height="146" rx="34" class="ink"/>
      <path class="line-white" d="M33 105V43L73 84L113 43V105"/>
      <circle cx="33" cy="105" r="5" fill="#CFE7FF"/>
      <circle cx="73" cy="84" r="5" fill="#CFE7FF"/>
      <circle cx="113" cy="105" r="5" fill="#CFE7FF"/>
    </g>
    <text x="208" y="164" class="word">MyBand</text>
    <text x="208" y="196" class="desc">A recognizable M, with three anchors suggesting a shared count-in.</text>
    <g transform="translate(208 226)">
      <rect width="248" height="52" rx="14" class="ink"/>
      <path d="M20 37V15L34 29L48 15V37" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="67" y="33" class="word-white" style="font-size: 21px; letter-spacing: -1px;">MyBand</text>
    </g>
    <text x="32" y="380" class="caption">Best for: app icon, navbar, avatar fallback, favicons</text>
  </g>

  <!-- 02: MEMBER ORBIT -->
  <g transform="translate(832 168)">
    <rect class="tile" width="704" height="430" rx="16"/>
    <text x="32" y="42" class="kicker">02 · MEMBER ORBIT</text>
    <text x="32" y="72" class="desc">The most collaboration-led direction — musicians arriving at the same beat.</text>

    <g transform="translate(32 108)">
      <rect width="146" height="146" rx="34" class="soft"/>
      <circle cx="73" cy="73" r="32" fill="#FFFFFF" class="hair"/>
      <path class="line-sm" d="M53 73H93M73 53V93"/>
      <circle cx="73" cy="22" r="9" class="ink"/>
      <circle cx="124" cy="73" r="9" class="ink"/>
      <circle cx="73" cy="124" r="9" class="ink"/>
      <circle cx="22" cy="73" r="9" class="ink"/>
    </g>
    <text x="208" y="164" class="word">MyBand</text>
    <text x="208" y="196" class="desc">Four distinct people, one central tempo: a clear metaphor for coordination.</text>
    <g transform="translate(208 226)">
      <rect width="248" height="52" rx="14" fill="#F0F0F3"/>
      <circle cx="24" cy="26" r="8" class="ink"/>
      <circle cx="44" cy="26" r="8" class="ink"/>
      <circle cx="64" cy="26" r="8" class="ink"/>
      <text x="83" y="33" class="word" style="font-size: 21px; letter-spacing: -1px;">MyBand</text>
    </g>
    <text x="32" y="380" class="caption">Best for: community, shared groups, onboarding</text>
  </g>

  <!-- 03: SETLIST BEAT -->
  <g transform="translate(64 638)">
    <rect class="tile" width="704" height="430" rx="16"/>
    <text x="32" y="42" class="kicker">03 · SETLIST BEAT</text>
    <text x="32" y="72" class="desc">A product-specific mark built around rehearsal order, songs, and momentum.</text>

    <g transform="translate(32 108)">
      <rect width="146" height="146" rx="34" class="ink"/>
      <rect x="35" y="38" width="76" height="12" rx="6" fill="#FFFFFF"/>
      <rect x="35" y="67" width="76" height="12" rx="6" fill="#FFFFFF" opacity=".82"/>
      <rect x="35" y="96" width="49" height="12" rx="6" fill="#FFFFFF" opacity=".62"/>
      <circle cx="99" cy="102" r="7" fill="#CFE7FF"/>
    </g>
    <text x="208" y="164" class="word">MyBand</text>
    <text x="208" y="196" class="desc">Three songs in a shared order; the final dot is the next downbeat.</text>
    <g transform="translate(208 226)">
      <rect width="248" height="52" rx="14" fill="#F0F0F3"/>
      <rect x="20" y="16" width="28" height="5" rx="2.5" class="ink"/>
      <rect x="20" y="25" width="28" height="5" rx="2.5" class="ink" opacity=".74"/>
      <rect x="20" y="34" width="19" height="5" rx="2.5" class="ink" opacity=".48"/>
      <text x="67" y="33" class="word" style="font-size: 21px; letter-spacing: -1px;">MyBand</text>
    </g>
    <text x="32" y="380" class="caption">Best for: setlists, rehearsals, operational product language</text>
  </g>

  <!-- 04: STAGE ARC -->
  <g transform="translate(832 638)">
    <rect class="tile" width="704" height="430" rx="16"/>
    <text x="32" y="42" class="kicker">04 · STAGE ARC</text>
    <text x="32" y="72" class="desc">The most expressive direction — a performance space held up by the team.</text>

    <g transform="translate(32 108)">
      <rect width="146" height="146" rx="34" fill="url(#sky)" stroke="#DCDEE0" stroke-width="2"/>
      <path class="line" d="M29 108C38 74 49 57 73 57C97 57 108 74 117 108"/>
      <path class="line-sm" d="M39 39H107M52 39V77M94 39V77"/>
      <circle cx="73" cy="57" r="7" class="ink"/>
    </g>
    <text x="208" y="164" class="word">MyBand</text>
    <text x="208" y="196" class="desc">A compact stage canopy: more emotive, still calm enough for a modern utility app.</text>
    <g transform="translate(208 226)">
      <rect width="248" height="52" rx="14" fill="#171717"/>
      <path d="M16 38C21 25 26 19 34 19C42 19 47 25 52 38M20 13H48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="67" y="33" class="word-white" style="font-size: 21px; letter-spacing: -1px;">MyBand</text>
    </g>
    <text x="32" y="380" class="caption">Best for: brand story, launch visuals, event-facing surfaces</text>
  </g>

  <g transform="translate(64 1110)">
    <rect width="1472" height="78" rx="16" class="soft"/>
    <text x="28" y="31" class="small">SYSTEM NOTE</text>
    <text x="28" y="57" class="caption">All four marks use #171717 ink, #FFFFFF canvas, #DCDEE0 hairlines, and the optional #CFE7FF sky accent. My recommendation is 01 for the primary identity; 02 and 04 can become supporting illustrations.</text>
  </g>
</svg>
