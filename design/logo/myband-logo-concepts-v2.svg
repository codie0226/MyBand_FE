<svg width="1600" height="1180" viewBox="0 0 1600 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .tile { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; }
      .ink { fill: #111111; }
      .white { fill: #ffffff; }
      .muted { fill: #666666; }
      .soft { fill: #f7f7f7; }
      .line-xl { stroke: #111111; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-lg { stroke: #111111; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .line-md { stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .line-sm { stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line-white { stroke: #ffffff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .line-white-sm { stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .title { font: 600 24px Inter, Arial, sans-serif; fill: #111111; letter-spacing: -0.5px; }
      .label { font: 600 12px Inter, Arial, sans-serif; fill: #111111; letter-spacing: 1px; }
      .desc { font: 400 13px Inter, Arial, sans-serif; fill: #666666; }
      .word { font: 700 28px Inter, Arial, sans-serif; fill: #111111; letter-spacing: -1.2px; }
      .word-medium { font: 600 27px Inter, Arial, sans-serif; fill: #111111; letter-spacing: -1px; }
      .mono { font: 500 12px "JetBrains Mono", Consolas, monospace; fill: #666666; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1180"/>
  <text x="64" y="78" class="title">MyBand logo concepts v2</text>
  <text x="64" y="108" class="desc">Black and white, more modern and minimal. Built for app icons, tab bars, splash screens, and restrained product branding.</text>

  <!-- 01 -->
  <g transform="translate(64 160)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">01 CUT M</text>
    <g transform="translate(92 72)">
      <rect x="0" y="0" width="96" height="96" rx="22" class="ink"/>
      <path class="line-white" d="M24 70V30L48 56L72 30V70"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">bold monogram, no ornament</text>
  </g>

  <!-- 02 -->
  <g transform="translate(368 160)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">02 TWO BARS</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="soft"/>
      <rect x="28" y="20" width="12" height="56" rx="6" class="ink"/>
      <rect x="56" y="20" width="12" height="56" rx="6" class="ink"/>
      <path class="line-sm" d="M34 76C40 84 56 84 62 76"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">minimal pause/play rehearsal mark</text>
  </g>

  <!-- 03 -->
  <g transform="translate(672 160)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">03 SINGLE STRING</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="ink"/>
      <path class="line-white-sm" d="M28 24V72"/>
      <path class="line-white-sm" d="M48 18V78"/>
      <path class="line-white-sm" d="M68 24V72"/>
      <circle cx="48" cy="48" r="7" class="white"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">instrument strings, abstracted</text>
  </g>

  <!-- 04 -->
  <g transform="translate(976 160)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">04 CORNER PICK</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="soft"/>
      <path d="M28 26H70V68C70 82 54 88 42 78L28 66V26Z" class="ink"/>
      <circle cx="50" cy="52" r="6" class="white"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">pick shape from one folded corner</text>
  </g>

  <!-- 05 -->
  <g transform="translate(1280 160)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">05 MB GRID</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="ink"/>
      <rect x="24" y="24" width="10" height="48" rx="5" class="white"/>
      <rect x="42" y="24" width="10" height="48" rx="5" class="white"/>
      <rect x="60" y="24" width="12" height="22" rx="6" class="white"/>
      <rect x="60" y="54" width="12" height="18" rx="6" class="white"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">MB reduced to vertical modules</text>
  </g>

  <!-- 06 -->
  <g transform="translate(64 480)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">06 WORD ONLY</text>
    <g transform="translate(48 78)">
      <text x="0" y="58" style="font: 700 46px Inter, Arial, sans-serif; fill: #111111; letter-spacing: -2.4px;">MyBand</text>
      <rect x="3" y="72" width="154" height="6" rx="3" class="ink"/>
    </g>
    <text x="55" y="202" class="word-medium">MyBand</text>
    <text x="48" y="232" class="desc">quiet wordmark with baseline pulse</text>
  </g>

  <!-- 07 -->
  <g transform="translate(368 480)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">07 RING MARK</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="soft"/>
      <circle cx="48" cy="48" r="26" stroke="#111111" stroke-width="8"/>
      <path class="line-md" d="M48 22V74"/>
      <path class="line-sm" d="M34 48H62"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">band as loop, beat as crossline</text>
  </g>

  <!-- 08 -->
  <g transform="translate(672 480)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">08 SLASH B</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="ink"/>
      <path class="line-white" d="M30 72V24"/>
      <path class="line-white-sm" d="M30 28H54C64 28 70 34 70 43C70 52 64 58 54 58H30"/>
      <path class="line-white-sm" d="M54 58C64 58 72 62 72 72C72 80 65 86 54 86H30"/>
      <path d="M70 18L22 84" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">B letterform with sharp edit</text>
  </g>

  <!-- 09 -->
  <g transform="translate(976 480)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">09 DOT SCORE</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="soft"/>
      <circle cx="28" cy="34" r="7" class="ink"/>
      <circle cx="48" cy="48" r="7" class="ink"/>
      <circle cx="68" cy="34" r="7" class="ink"/>
      <circle cx="38" cy="68" r="7" class="ink"/>
      <circle cx="58" cy="68" r="7" class="ink"/>
      <path class="line-sm" d="M28 34L48 48L68 34M48 48L38 68M48 48L58 68"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">members as a compact score</text>
  </g>

  <!-- 10 -->
  <g transform="translate(1280 480)">
    <rect class="tile" width="280" height="280" rx="12"/>
    <text x="22" y="38" class="label">10 MINIMAL GUITAR</text>
    <g transform="translate(92 72)">
      <rect width="96" height="96" rx="22" class="soft"/>
      <path class="line-lg" d="M32 66C24 58 25 44 34 37C42 31 53 34 58 42C66 47 68 58 61 66C53 75 40 75 32 66Z"/>
      <path class="line-md" d="M58 42L76 24"/>
      <path class="line-sm" d="M70 22L78 30"/>
      <circle cx="46" cy="56" r="5" class="ink"/>
    </g>
    <text x="64" y="202" class="word">MyBand</text>
    <text x="48" y="232" class="desc">instrument mark with fewer strokes</text>
  </g>

  <g transform="translate(64 834)">
    <rect class="tile" width="1496" height="250" rx="12"/>
    <text x="28" y="44" class="title">Direction notes</text>
    <text x="28" y="78" class="desc">This round removes color, gradients, and illustrative detail. The strongest app-icon paths are 01, 03, 05, and 07.</text>
    <text x="28" y="106" class="desc">Most modern/minimal: 01 Cut M. Most unique without losing music context: 03 Single String. Best system-brand option: 05 MB Grid.</text>
    <text x="28" y="134" class="desc">Recommended next step: refine 01 and 05 at 16px, 24px, 48px, and 1024px app-icon sizes, then choose one black-on-white and one white-on-black variant.</text>
    <text x="28" y="178" class="mono">Palette: #111111 / #ffffff only. Optional preview background #f7f7f7 is not part of the logo.</text>
    <text x="28" y="206" class="mono">Geometry: centered marks, high contrast, rounded terminals, reduced details, no musical cliché unless abstracted.</text>
  </g>
</svg>
