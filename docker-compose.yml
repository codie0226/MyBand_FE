services:
  app:
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:-https://myband.codie.kr/api}
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
